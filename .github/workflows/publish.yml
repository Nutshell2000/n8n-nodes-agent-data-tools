name: Publish to npm

# Publishes n8n-nodes-agent-data-tools with an npm provenance statement. n8n only verifies community
# nodes published from GitHub Actions with provenance, never ones published from a local machine.
# Runs when a tag v<version> is pushed, and the version must equal the one in package.json.
#
# One-time setup on npmjs.com, by the package owner: package settings -> Trusted Publishers ->
# GitHub Actions: user Nutshell2000, repository n8n-nodes-agent-data-tools, workflow publish.yml,
# environment empty. No secret is stored here. Fallback: a granular token in the secret NPM_TOKEN.
#
# Adapted from https://github.com/n8n-io/n8n-nodes-starter/blob/master/.github/workflows/publish.yml
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: The tag must name the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version (expected v$version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
